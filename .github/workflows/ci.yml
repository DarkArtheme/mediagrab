name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  # Build the bot image on every PR (validation only) and push it to GHCR on
  # every master push as :edge and an immutable semver dev tag
  # :X.Y.(Z+1)-dev.<short-sha> — a pre-release of the *next* patch after the
  # version in bot/pyproject.toml, so dev builds sort after the released X.Y.Z.
  # Release tags (X.Y.Z, X.Y, latest) come from the Release workflow on bot-v*.
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute dev version
        id: ver
        run: |
          next="$(python3 -c "
          import tomllib
          major, minor, patch = tomllib.load(open('bot/pyproject.toml','rb'))['project']['version'].split('.')
          print(f'{major}.{minor}.{int(patch)+1}')
          ")"
          echo "devtag=${next}-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reelsbot
          tags: |
            type=edge,branch=master
            type=raw,value=${{ steps.ver.outputs.devtag }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.devtag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
