[project]
name = "mediagrab"
version = "0.1.0"
description = "Turn a social-media URL into downloaded media plus its text description."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.6.9",
    "gallery-dl>=1.29",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
