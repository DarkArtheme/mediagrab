# The bot, plus an optional Local Bot API Server (2 GB upload limit).
#
# Default (`docker compose up -d --build`): bot only, talking to the cloud
# api.telegram.org (50 MB upload cap) — leave TELEGRAM_API_URL empty in .env;
# TELEGRAM_API_ID/HASH are not needed.
#
# 2 GB mode (`docker compose --profile local-api up -d --build`): also starts
# aiogram/telegram-bot-api; requires TELEGRAM_API_ID/HASH from my.telegram.org
# and TELEGRAM_API_URL=http://telegram-bot-api:8081 in .env.
#
# BOT_VERSION pins the image tag (defaults to "dev" for local builds); set it
# in .env or the shell to match the bot/pyproject.toml version being deployed.
services:
  telegram-bot-api:
    profiles: [local-api]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${BOT_VERSION:-dev}
    # Local build by default; set BOT_IMAGE=ghcr.io/darkartheme/reelsbot and
    # BOT_VERSION=<tag> in .env to run a CI-built image instead
    # (then `docker compose pull bot && docker compose up -d --no-build`).
    image: ${BOT_IMAGE:-reelsbot}:${BOT_VERSION:-dev}
    env_file: .env
    volumes:
      - ./instagram.txt:/data/cookies/instagram.txt:ro
      - db-data:/data/db
      - video-cache:/data/tmp
    restart: unless-stopped
    # Must exceed the bot's SHUTDOWN_GRACE (30s) so in-flight jobs can drain.
    stop_grace_period: 45s

volumes:
  telegram-bot-api-data:
  db-data:
  video-cache:
